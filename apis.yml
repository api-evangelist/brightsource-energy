aid: brightsource-energy
name: BrightSource Energy
description: 'BrightSource Energy is a renewable energy technology company founded in
  2006, historically known as a pioneer of utility-scale Concentrated Solar Power (CSP)
  — it designed, developed and built the 377 MW Ivanpah Solar Electric Generating System
  in California along with CSP projects in Israel, Dubai and South Africa. In 2022 the
  company transformed into a software business and now commercializes OASES, a cloud-based,
  AI-powered Energy Management System (EMS) that forecasts, optimizes and dispatches
  portfolios of photovoltaics, battery energy storage (BESS), wind, microgrids and EV
  charging. OASES combines physics-based digital twins, big-data analytics and sensor
  fusion with an on-site SCADA edge controller ("OASES Gateway + IoT") to run asset
  management, energy-market bidding and arbitrage, PPA management, grid services and
  frequency regulation. Engineering is based in Jerusalem, Israel, with a UK office in
  London. BrightSource does not publish a public developer program, API documentation
  or machine-readable API contract as of August 2026.'
